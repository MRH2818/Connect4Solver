<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="css/home.css" />
        <script src="../js/urlencoding.js"></script>
        <script src="js/addplayersdropdown.js" defer></script>
        <script src="js/boardsizestepper.js" defer></script>
        <script src="js/formsubmit.js" defer></script>
    </head>
    <body>
        <form id="game-setup-form" action="#" method="post">
            <h1>Set up your game!</h1>
            <div id="players-container">
                <!-- PRE-DEFINED PLAYER TILES TO ENFORCE 2 TILE MINIMUM -->
                <div class="playertile" id="player_1">
                    <p>Player 1:</p>
                    <select name="playertype_1">
                        <option>Human</option>
                        <option>KorfBot</option>
                    </select>
                    <div class="player-color-setting">
                        <span class="player-color-swatch" style="background-color: red;"></span>
                        <span class="player-color-text">Color: red</span>
                    </div>
                </div>
                <div class="playertile" name="playertype" id="player_2">
                    <p>Player 2:</p>
                    <select name="playertype_2">
                        <option>Human</option>
                        <option>KorfBot</option>
                    </select>
                    <div class="player-color-setting">
                        <span class="player-color-swatch" style="background-color: yellow;"></span>
                        <span class="player-color-text">Color: yellow</span>
                    </div>
                </div>
            </div>
            
            <!-- ADD NEW PLAYERS, NEW PLAYERS SHOULD ALSO HAVE A REMOVE OPTION -->
            <button type="button" onclick="addPlayer()">Add player</button>

            <!-- SET GAME MODE TO EITHER 2D OR 3D -->
            <div class="toggle">
                <strong>Set number of board dimensions:</strong>
                <div>
                    <label>
                        <input name="num-dimensions" type="radio" value="2" checked />
                        2D
                    </label>
                    <label>
                        <input name="num-dimensions" type="radio" value="3" />
                        3D
                    </label>
                </div>
            </div>

            <!-- SET BOARD SIZE (MAX 10, 7 for 3D+) -->
            <label for="board-size"><strong>Set board size (max 10 for 2D, 7 for 3D+):</strong></label>
            <div class="stepper" data-stepper-for="board-size">
                <input id="board-size" name="boardsize" type="number" min="4" max="10" step="1" value="7" />
                <div class="stepper-dial" aria-label="Adjust board size">
                    <button type="button" class="stepper-btn stepper-up" aria-label="Increase board size">+</button>
                    <button type="button" class="stepper-btn stepper-down" aria-label="Decrease board size">-</button>
                </div>
            </div>

            <!-- SET WHETHER PLAYER ORDER SHOULD BE RANDOMIZED -->
            <div class="toggle">
                <strong>Random turn order?</strong>
                <div>
                    <label>
                        <input name="randomize-player-order" type="radio" value="true" />
                        Yes
                    </label>
                    <label>
                        <input name="randomize-player-order" type="radio" value="false" checked />
                        No
                    </label>
                </div>
            </div>

            <!-- ON CLICK, HANDLE SUBMISSION IN JAVASCRIPT -->
            <button type="submit">Play!</button>
        </form>
    </body>
</html>
