<!DOCTYPE html>
<html>
    <head>
        <title>3D Connect 4</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        
        <!-- JAVASCRIPT! -->
        <script src="../js/connect4_utils.js"></script>
        <script src="../js/urlencoding.js"></script>
        
        <!-- <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script> -->
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
                }
            }
        </script>
        
        <script src="js/drawBoard3d.js" defer></script>
        <script src="js/handle3d.js" defer></script>
        
        <!-- STYLESHEETS! -->
        <link rel="stylesheet" href="css/3dgame.css">
    </head>
    <body>
        <a class="back-button" href="../index.html">Home</a>
        <!-- <h1>Welcome to the 3d game!</h1> -->
        <div id="game-scroll-buttons">
            <button id="undoMoveButton" type="button">Undo Move</button>
            <button id="nextMoveButton" type="button">Next Move</button>
        </div>
        <canvas id="boardCanvas"></canvas>
        <div id="statusUpdate"></div>
        <div id="controls-legend">
            <p class="clicktoplace">Click to place!</p>
            <p class="legend-item"><span>Left Click:</span> Drag</p>
            <p class="legend-item"><span>Right Click:</span> Pan</p>
            <p class="legend-item"><span>Scroll:</span> Zoom</p>
        </div>
    </body>
</html>
